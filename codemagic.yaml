workflows:
  ios-build:
    name: Sub by Audiocraft iOS Build
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - ios_credentials
    integrations:
      app_store_connect: Codemagic3
    scripts:
      - name: Generate Xcode Project
        script: |
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Install Metal Toolchain
        script: |
          set -euo pipefail

          echo "Selected Xcode:"
          xcodebuild -version
          echo "Downloading the Metal Toolchain required by MLX..."
          xcodebuild -downloadComponent metalToolchain
          echo "Installed Metal compiler:"
          xcrun --sdk iphonesimulator metal --version
      - name: Run Unit Tests
        script: |
          set -euo pipefail

          echo "Selected Xcode:"
          xcodebuild -version
          echo "Installed iOS runtimes:"
          xcrun simctl list runtimes available

          # simctl'in metin çıktısı Xcode sürümleri arasında değişebiliyor. JSON çıktısından
          # önce mevcut ve kullanılabilir bir iPhone seç; Pro cihazı varsa onu tercih et.
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [device for runtime_devices in data.get("devices", {}).values() for device in runtime_devices if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone")]
          devices.sort(key=lambda device: ("Pro" not in device.get("name", ""), device.get("state") != "Booted", device.get("name", "")))
          print(devices[0].get("udid", "") if devices else "")
          ')

          CREATED_SIMULATOR=false
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No pre-created iPhone found; creating one from the installed runtime."

            RUNTIME_ID=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          runtimes = [runtime for runtime in json.load(sys.stdin).get("runtimes", []) if runtime.get("isAvailable", True) and runtime.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
          print(runtimes[-1].get("identifier", "") if runtimes else "")
          ')

            DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          devices = [device for device in json.load(sys.stdin).get("devicetypes", []) if device.get("name", "").startswith("iPhone")]
          preferred = [device for device in devices if "Pro" in device.get("name", "")]
          selected = preferred[-1] if preferred else (devices[-1] if devices else {})
          print(selected.get("identifier", ""))
          ')

            if [ -z "$RUNTIME_ID" ] || [ -z "$DEVICE_TYPE_ID" ]; then
              echo "No usable iOS Simulator runtime or iPhone device type is installed."
              xcrun simctl list
              exit 1
            fi

            SIMULATOR_ID=$(xcrun simctl create \
              "SubByAudiocraft Tests" \
              "$DEVICE_TYPE_ID" \
              "$RUNTIME_ID")
            CREATED_SIMULATOR=true
          fi

          cleanup_simulator() {
            if [ "$CREATED_SIMULATOR" = true ]; then
              xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true
              xcrun simctl delete "$SIMULATOR_ID" 2>/dev/null || true
            fi
          }
          trap cleanup_simulator EXIT

          echo "Testing on simulator: $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

          mkdir -p build/ios/test
          xcodebuild test \
            -project SubByAudiocraft.xcodeproj \
            -scheme SubByAudiocraft \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 120 \
            -resultBundlePath build/ios/test/SubByAudiocraftTests.xcresult \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.hmyilm.SubByAudiocraft" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build App for TestFlight
        script: |
          xcode-project build-ipa --project SubByAudiocraft.xcodeproj --scheme SubByAudiocraft
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/test/*.xcresult
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # IPA App Store Connect'e yüklenir ve İç TestFlight'ta kullanılabilir.
        # Dış beta incelemesi kişisel iletişim/test bilgileri gerektirdiği için otomatik
        # gönderilmez. Dış test açılacağı zaman bilgiler doldurulup true yapılabilir.
        submit_to_testflight: false
