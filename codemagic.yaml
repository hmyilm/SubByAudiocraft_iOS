workflows:
  ios-build:
    name: Sub by Audiocraft iOS Build
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - ios_credentials
    integrations:
      app_store_connect: Codemagic3
    scripts:
      - name: Generate Xcode Project
        script: |
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Install Dependencies
        script: |
          pod install
      - name: Run Unit Tests
        script: |
          SIMULATOR_ID=$(xcrun simctl list devices available | sed -nE 's/.*\(([0-9A-F-]{36})\) \((Shutdown|Booted)\)$/\1/p' | head -1)
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iOS Simulator found"
            exit 1
          fi
          xcodebuild test \
            -workspace SubByAudiocraft.xcworkspace \
            -scheme SubByAudiocraft \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.hmyilm.SubByAudiocraft" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build App for TestFlight
        script: |
          xcode-project build-ipa --workspace SubByAudiocraft.xcworkspace --scheme SubByAudiocraft
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
