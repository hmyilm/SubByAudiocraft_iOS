name: SubByAudiocraft
options:
  bundleIdPrefix: com.hmyilm
settings:
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: -Onone
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.0.0
  Qwen3Speech:
    url: https://github.com/soniqo/speech-swift
    exactVersion: 0.0.23
  # mlx-swift 0.31.5+ CudaBuild eklentisini tüm hedef grafiğine ekliyor.
  # CUDA iOS'ta kullanılmadığı halde Xcode, etkileşimsiz CI testinde eklenti onayı
  # bekliyor. Qwen3Speech 0.0.23 ile uyumlu son eklentisiz sürümü sabit tut.
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
targets:
  SubByAudiocraft:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    version: 1.21.5
    build: 58
    settings:
      base:
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        PRODUCT_NAME: SubByAudiocraft
        SWIFT_VERSION: "5.0"
        ALWAYS_SEARCH_USER_PATHS: NO
        DEVELOPMENT_TEAM: "AHFN85GQX6"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.hmyilm.SubByAudiocraft
        MARKETING_VERSION: "1.21.5"
        CURRENT_PROJECT_VERSION: "58"
    sources: [SubByAudiocraft]
    dependencies:
      - package: WhisperKit
      - package: Qwen3Speech
        product: Qwen3ASR
      - package: Qwen3Speech
        product: SourceSeparation
      - package: Qwen3Speech
        product: AudioCommon
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - framework: FFmpegKitFrameworks/libavdevice.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libavformat.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libavutil.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libavcodec.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libswresample.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libswscale.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libavfilter.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/ffmpegkit.xcframework
        embed: true
    postCompileScripts:
      - name: Strip arm64e and Generate dSYMs
        basedOnDependencyAnalysis: false
        script: |
          # Embedded device slices are only relevant to App Store/Release builds.
          # Running dsymutil over simulator frameworks adds about a minute to every
          # local build and only produces "no debug symbols" warnings.
          if [ "$PLATFORM_NAME" != "iphoneos" ] || [ "$CONFIGURATION" != "Release" ]; then
              echo "Skipping embedded framework post-processing for $CONFIGURATION/$PLATFORM_NAME."
              exit 0
          fi

          echo "Stripping arm64e and generating dSYMs for embedded frameworks..."
          if [ -d "$CODESIGNING_FOLDER_PATH/Frameworks" ]; then
              find "$CODESIGNING_FOLDER_PATH/Frameworks" -type f -name "*" | while read -r binary_path; do
                  if file "$binary_path" | grep -q "Mach-O"; then
                      # Strip arm64e
                      if lipo -info "$binary_path" | grep -q "arm64e"; then
                          echo "Removing arm64e from $binary_path"
                          lipo -remove arm64e -output "$binary_path" "$binary_path"
                          
                          # MUST re-sign the framework because lipo broke the original signature!
                          framework_dir=$(dirname "$binary_path")
                          codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --preserve-metadata=identifier,entitlements "$framework_dir"
                      fi
                      
                      # Generate dSYM for the framework to satisfy App Store Connect
                      binary_name=$(basename "$binary_path")
                      dsym_path="$DWARF_DSYM_FOLDER_PATH/$binary_name.dSYM"
                      if [ ! -d "$dsym_path" ]; then
                          echo "Generating dSYM for $binary_name"
                          dsymutil "$binary_path" -o "$dsym_path"
                      fi
                  fi
              done
          fi
    info:
      path: SubByAudiocraft/Info.plist
      properties:
        UIAppFonts:
          - Anton-Regular.ttf
          - Bangers-Regular.ttf
          - BebasNeue-Regular.ttf
          - Lato-Regular.ttf
          - Lato-Bold.ttf
          - Pacifico-Regular.ttf
          - Poppins-Regular.ttf
          - Poppins-Bold.ttf
          - Lobster-Regular.ttf
          - AbrilFatface-Regular.ttf
          - AlfaSlabOne-Regular.ttf
          - Righteous-Regular.ttf
          - FrancoisOne-Regular.ttf
          - Shrikhand-Regular.ttf
          - BlackOpsOne-Regular.ttf
          - GreatVibes-Regular.ttf
          - PetitFormalScript-Regular.ttf
          - Allura-Regular.ttf
          - Sacramento-Regular.ttf
          - Parisienne-Regular.ttf
          - KaushanScript-Regular.ttf
          - MarckScript-Regular.ttf
          - Courgette-Regular.ttf
          - Montserrat-Regular.ttf
          - Montserrat-Bold.ttf
          - Montserrat-ExtraBold.ttf
          - ArchivoBlack-Regular.ttf
          - LeagueSpartan-Regular.ttf
          - LeagueSpartan-Bold.ttf
          - Oswald-Regular.ttf
          - Oswald-Bold.ttf
          - PlayfairDisplay-Regular.ttf
          - PlayfairDisplay-Bold.ttf
          - PlayfairDisplay-Black.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
          - Caveat-Regular.ttf
          - Caveat-Bold.ttf
        UILaunchScreen: {}
        CFBundleIconName: AppIcon
        CFBundleDisplayName: Sub by Audiocraft
        CFBundleShortVersionString: "1.21.5"
        CFBundleVersion: "58"
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Videolarınızı işleyebilmek için fotoğraf galerinize erişmemiz gerekiyor."
        NSPhotoLibraryAddUsageDescription: "Oluşturulan altyazılı videoyu galerinize kaydetmek için izin gerekiyor."
        # Uygulama kamera/mikrofon KULLANMAZ; FFmpeg kütüphanesi bu API'lere referans
        # verdiği için Apple bu açıklama metinlerini zorunlu tutuyor (ITMS-90683).
        NSCameraUsageDescription: "Uygulama kamerayı kullanmaz. Bu izin metni, video işleme motorunun (FFmpeg) sistem gereksinimleri nedeniyle bulunmaktadır."
        NSMicrophoneUsageDescription: "Uygulama mikrofonu kullanmaz. Bu izin metni, video işleme motorunun (FFmpeg) sistem gereksinimleri nedeniyle bulunmaktadır."
  SubByAudiocraftTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    settings:
      base:
        ALWAYS_SEARCH_USER_PATHS: NO
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_NAME: SubByAudiocraftTests
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        SWIFT_VERSION: "5.0"
    sources: [SubByAudiocraftTests]
    dependencies:
      - target: SubByAudiocraft
schemes:
  SubByAudiocraft:
    build:
      targets:
        SubByAudiocraft: all
        SubByAudiocraftTests: [test]
    test:
      targets:
        - SubByAudiocraftTests
