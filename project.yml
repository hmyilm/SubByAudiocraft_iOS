name: SubByAudiocraft
options:
  bundleIdPrefix: com.hmyilm
settings:
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: -Onone
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.0.0
  Qwen3Speech:
    url: https://github.com/soniqo/speech-swift
    exactVersion: 0.0.23
  # mlx-swift 0.31.5+ CudaBuild eklentisini tüm hedef grafiğine ekliyor.
  # CUDA iOS'ta kullanılmadığı halde Xcode, etkileşimsiz CI testinde eklenti onayı
  # bekliyor. Qwen3Speech 0.0.23 ile uyumlu son eklentisiz sürümü sabit tut.
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
targets:
  SubByAudiocraft:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    version: 1.21.5
    build: 59
    settings:
      base:
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        PRODUCT_NAME: SubByAudiocraft
        SWIFT_VERSION: "5.0"
        ALWAYS_SEARCH_USER_PATHS: NO
        DEVELOPMENT_TEAM: "AHFN85GQX6"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.hmyilm.SubByAudiocraft
        MARKETING_VERSION: "1.21.5"
        CURRENT_PROJECT_VERSION: "59"
    sources: [SubByAudiocraft]
    dependencies:
      - package: WhisperKit
      - package: Qwen3Speech
        product: Qwen3ASR
      - package: Qwen3Speech
        product: SourceSeparation
      - package: Qwen3Speech
        product: AudioCommon
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - framework: FFmpegKitFrameworks/libavdevice.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libavformat.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libavutil.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libavcodec.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libswresample.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libswscale.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/libavfilter.xcframework
        embed: true
      - framework: FFmpegKitFrameworks/ffmpegkit.xcframework
        embed: true
    postBuildScripts:
      - name: Install and Verify FFmpeg dSYMs
        basedOnDependencyAnalysis: false
        script: |
          # The maintained FFmpegKitNext frameworks are device-arm64 only at archive
          # time and ship with matching, source-built dSYMs inside each XCFramework.
          if [ "$PLATFORM_NAME" != "iphoneos" ] || [ "$CONFIGURATION" != "Release" ]; then
              echo "Skipping FFmpeg dSYM installation for $CONFIGURATION/$PLATFORM_NAME."
              exit 0
          fi

          frameworks="ffmpegkit libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale"
          for framework_name in $frameworks; do
              binary_path="$CODESIGNING_FOLDER_PATH/Frameworks/$framework_name.framework/$framework_name"
              source_dsym="$SRCROOT/FFmpegKitFrameworks/$framework_name.xcframework/ios-arm64/dSYMs/$framework_name.framework.dSYM"
              destination_dsym="$DWARF_DSYM_FOLDER_PATH/$framework_name.framework.dSYM"

              if [ ! -f "$binary_path" ]; then
                  echo "error: Embedded FFmpeg framework is missing: $binary_path"
                  exit 1
              fi
              if [ ! -d "$source_dsym" ]; then
                  echo "error: Prebuilt FFmpeg dSYM is missing: $source_dsym"
                  exit 1
              fi

              ditto "$source_dsym" "$destination_dsym"
              binary_uuid=$(dwarfdump --uuid "$binary_path" | awk '/arm64/ { print $2; exit }')
              dsym_uuid=$(dwarfdump --uuid "$destination_dsym" | awk '/arm64/ { print $2; exit }')
              if [ -z "$binary_uuid" ] || [ "$binary_uuid" != "$dsym_uuid" ]; then
                  echo "error: dSYM UUID mismatch for $framework_name ($binary_uuid != $dsym_uuid)"
                  exit 1
              fi
              echo "Installed verified dSYM for $framework_name ($binary_uuid)"
          done
    info:
      path: SubByAudiocraft/Info.plist
      properties:
        UIAppFonts:
          - Anton-Regular.ttf
          - Bangers-Regular.ttf
          - BebasNeue-Regular.ttf
          - Lato-Regular.ttf
          - Lato-Bold.ttf
          - Lato-Light.ttf
          - Pacifico-Regular.ttf
          - Poppins-Regular.ttf
          - Poppins-Bold.ttf
          - Poppins-Light.ttf
          - Lobster-Regular.ttf
          - AbrilFatface-Regular.ttf
          - AlfaSlabOne-Regular.ttf
          - Righteous-Regular.ttf
          - FrancoisOne-Regular.ttf
          - Shrikhand-Regular.ttf
          - BlackOpsOne-Regular.ttf
          - GreatVibes-Regular.ttf
          - PetitFormalScript-Regular.ttf
          - Allura-Regular.ttf
          - Sacramento-Regular.ttf
          - Parisienne-Regular.ttf
          - KaushanScript-Regular.ttf
          - MarckScript-Regular.ttf
          - Courgette-Regular.ttf
          - Montserrat-Regular.ttf
          - Montserrat-Bold.ttf
          - Montserrat-ExtraBold.ttf
          - Montserrat-Light.ttf
          - ArchivoBlack-Regular.ttf
          - LeagueSpartan-Regular.ttf
          - LeagueSpartan-Bold.ttf
          - Oswald-Regular.ttf
          - Oswald-Bold.ttf
          - PlayfairDisplay-Regular.ttf
          - PlayfairDisplay-Bold.ttf
          - PlayfairDisplay-Black.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
          - Caveat-Regular.ttf
          - Caveat-Bold.ttf
        UILaunchScreen: {}
        CFBundleIconName: AppIcon
        CFBundleDisplayName: Sub by Audiocraft
        CFBundleShortVersionString: "1.21.5"
        CFBundleVersion: "59"
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Videolarınızı işleyebilmek için fotoğraf galerinize erişmemiz gerekiyor."
        NSPhotoLibraryAddUsageDescription: "Oluşturulan altyazılı videoyu galerinize kaydetmek için izin gerekiyor."
        # Uygulama kamera/mikrofon KULLANMAZ; FFmpeg kütüphanesi bu API'lere referans
        # verdiği için Apple bu açıklama metinlerini zorunlu tutuyor (ITMS-90683).
        NSCameraUsageDescription: "Uygulama kamerayı kullanmaz. Bu izin metni, video işleme motorunun (FFmpeg) sistem gereksinimleri nedeniyle bulunmaktadır."
        NSMicrophoneUsageDescription: "Uygulama mikrofonu kullanmaz. Bu izin metni, video işleme motorunun (FFmpeg) sistem gereksinimleri nedeniyle bulunmaktadır."
  SubByAudiocraftTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    settings:
      base:
        ALWAYS_SEARCH_USER_PATHS: NO
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_NAME: SubByAudiocraftTests
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        SWIFT_VERSION: "5.0"
    sources: [SubByAudiocraftTests]
    dependencies:
      - target: SubByAudiocraft
schemes:
  SubByAudiocraft:
    build:
      targets:
        SubByAudiocraft: all
        SubByAudiocraftTests: [test]
    test:
      targets:
        - SubByAudiocraftTests
